name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm audit --audit-level=moderate
        continue-on-error: true

  build:
    name: Build & Bundle Check
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build:css:once
      - run: |
          CSS_SIZE=$(wc -c < public/css/output.css)
          echo "CSS output: $CSS_SIZE bytes"
          if [ $CSS_SIZE -gt 100000 ]; then exit 1; fi

  integration:
    name: Integration Smoke Test
    runs-on: ubuntu-latest
    needs: build
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: transpiler
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build:css:once
      - run: mysql -h 127.0.0.1 -P 3306 -u root -proot transpiler < database/schema.sql
      - run: |
          export DB_HOST=127.0.0.1
          export DB_USER=root
          export DB_PASSWORD=root
          export DB_NAME=transpiler
          node server.js &
          sleep 5
      - run: |
          curl -s -X POST http://localhost:3000/api/compile \
            -H "Content-Type: application/json" \
            -d '{"source":"int x = 5; print(x);"}' | grep -q '"success":true'
          echo "✅ Basic compile works"
      - run: |
          curl -s -X POST http://localhost:3000/api/compile \
            -H "Content-Type: application/json" \
            -d '{"source":"function int add(int a, int b) { return a + b; } print(add(2,3));"}' | grep -q '"success":true'
          echo "✅ Functions work"
      - run: |
          curl -s http://localhost:3000/ | grep -q "Assembly Transpiler"
          echo "✅ Frontend loads"
